services:
  astra_ros2:
    build:
      context: .
      dockerfile: Dockerfile
    image: orbbec_astra_ros2:latest
    container_name: orbbec_astra_ros2
    network_mode: host
    ipc: host
    privileged: true
    volumes:
      - /dev:/dev:rw
      - .:/workspace
    working_dir: /workspace/orbbec_ws
    command: bash -c "colcon build --event-handlers console_direct+ --cmake-args -DCMAKE_BUILD_TYPE=Release && source install/setup.bash && ros2 launch astra_camera astra_pro.launch.xml"
