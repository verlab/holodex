; Default: USB env only (avoid failing when SoftAP is down)
[platformio]
default_envs = esp32doit-devkit-v1

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
; min_spiffs keeps two OTA slots but grows each app partition to 1.9 MB.
; default.csv (1.25 MB) was full at 100%, which forced feature/HTML trade-offs.
; Requires one USB flash for the new table to take effect.
board_build.partitions = min_spiffs.csv

; USB upload (default)
upload_flags =
    --before=default_reset
    --after=hard_reset

; --- OTA via SoftAP (after first USB flash) ---
; upload_protocol = espota
; upload_port = 192.168.4.1
; upload_flags =
;     --auth=holodex

lib_deps =
    https://github.com/eclipse-zenoh/zenoh-pico.git
    gin66/FastAccelStepper
    dfrobot/DFRobot_BMI160 @ ^1.0.0
    bblanchon/ArduinoJson @ ^7.2.1
    links2004/WebSockets @ ^2.4.1

; zenoh-pico library.json pulls FreeRTOS/BluetoothSerial for other boards —
; ESP32 Arduino already has FreeRTOS; installing feilipu/FreeRTOS breaks the build.
lib_ignore =
    FreeRTOS
    BluetoothSerial

; Arduino-ESP32 (NOT ESP-IDF). zenoh-pico extra_script also sets these;
; keep them explicit so Windows/Linux resolve the same platform headers.
build_flags =
    -DZENOH_COMPILER_GCC
    -DZENOH_ARDUINO_ESP32
    -DZENOH_C_STANDARD=99
    -DCORE_DEBUG_LEVEL=1
    -DARDUINOJSON_ENABLE_PROGMEM=1
    -Iinclude

[env:esp32doit-ota]
extends = env:esp32doit-devkit-v1
upload_protocol = espota
upload_port = 192.168.4.1
upload_flags =
    --auth=holodex
