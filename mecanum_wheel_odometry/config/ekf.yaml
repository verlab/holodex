ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.1
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.0
    print_diagnostics: true
    debug: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # O EKF é a ÚNICA fonte de TF odom -> base_link no sistema
    publish_tf: true

    # 1. Odometria das rodas Mecanum (/odom/wheel)
    # Fusão de velocidades planares (vx, vy) e velocidade angular (wz)
    odom0: /odom/wheel
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 10
    odom0_nodelay: true
    odom0_differential: false
    odom0_relative: false

    # 2. Sensor inercial (/imu/data de imu_filter_madgwick)
    # Somente velocidade angular wz. O yaw absoluto do Madgwick (sem magnetometro) e apenas o giro
    # integrado: usa-lo junto com wz contaria a mesma informacao duas vezes. O yaw absoluto vem do ICP.
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_nodelay: true
    imu0_differential: false
    imu0_relative: true
    imu0_queue_size: 10
    imu0_remove_gravitational_acceleration: true

    # 3. Odometria visual 3D (small_gicp VGICP) - pose absoluta X, Y, Yaw
    # So pose (sem velocidades): as velocidades do ICP sao diferencas finitas ruidosas e as rodas ja as fornecem.
    # Covariancia vem do ICP (H^-1 com piso); em TRACKING_LOST ela e inflada (1e3) e o EKF a ignora.
    # O chute inicial do ICP usa /odom/wheel (nao /odometry/filtered), evitando realimentacao.
    odom1: /icp/odom
    odom1_config: [true,  true,  false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_queue_size: 10
    odom1_nodelay: true
    odom1_differential: false
    odom1_relative: false
    # Rejeicao de outliers por distancia de Mahalanobis (a covariancia do EKF cresce sem correcao,
    # entao um ICP recuperado volta a ser aceito)
    odom1_pose_rejection_threshold: 5.0
