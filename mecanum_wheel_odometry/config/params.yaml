mecanum_wheel_odometry_node:
  ros__parameters:
    # Parâmetros geométricos da base HoloDex
    wheel_radius: 0.050        # metros (raio da roda Mecanum = 50 mm)
    track_width: 0.390         # metros (distância entre centros de rodas esq/dir = 2 * ly)
    wheel_base: 0.380          # metros (distância entre eixos dianteiro/traseiro = 2 * lx)
    ticks_per_rev: 4096.0      # Resolução dos encoders magnéticos AS5600 (12 bits)

    # Configuração de frames e TF
    odom_frame: "odom"
    base_frame: "base_link"
    publish_tf: false          # MANDATÓRIO: false para evitar conflito com EKF robot_localization

    # Tópicos
    # Sinal por roda (FL, FR, RL, RR). Verifique na bancada: girar cada roda para frente deve
    # AUMENTAR seu tick; se diminuir, use -1.0 naquela roda.
    wheel_signs: [1.0, 1.0, 1.0, 1.0]

    ticks_topic: "/wheel/ticks"
    odom_topic: "/odom/wheel"

    # Covariâncias diagonais (x, y, z, roll, pitch, yaw)
    # Pose: x, y incerteza ~1cm; z, roll, pitch infinito (plano 2D); yaw incerteza ~0.02 rad
    pose_covariance_diagonal: [0.01, 0.01, 1000000.0, 1000000.0, 1000000.0, 0.02]
    # Twist: vx, vy incerteza ~0.01 m/s; vz, wx, wy infinito; vyaw ~0.02 rad/s
    twist_covariance_diagonal: [0.01, 0.01, 1000000.0, 1000000.0, 1000000.0, 0.02]
