pointcloud_filter_component:
  ros__parameters:
    input_cloud_topic: "/camera/depth/points"
    output_cloud_topic: "/camera/filtered_points"
    mask_topic: "/yolo/dynamic_mask"
    stride_u: 8
    stride_v: 8
    min_range: 0.4
    max_range: 3.8
    enable_dynamic_filter: false
    mask_timeout_sec: 0.5

icp_odometry_component:
  ros__parameters:
    input_cloud_topic: "/camera/filtered_points"
    odom_topic: "/icp/odom"
    # Chute inicial: SOMENTE odometria de rodas (independente do ICP). NAO usar /odometry/filtered:
    # o EKF funde /icp/odom, e isso criaria um laco de realimentacao (dupla contagem).
    initial_guess_topic: "/odom/wheel"
    odom_frame_id: "odom"
    base_frame_id: "base_link"
    publish_tf: false
    use_tf_extrinsic: true
    voxel_resolution: 0.15
    min_pos_variance: 1.0e-4   # piso de variancia de posicao (m^2) = 1 cm
    min_rot_variance: 1.0e-3   # piso de variancia de rotacao (rad^2)
    lost_variance: 1.0e3       # variancia publicada quando a medicao e invalida/TRACKING_LOST
    keyframe_delta_trans: 0.15
    keyframe_delta_rot_deg: 8.0
    num_threads: 4
    max_iterations: 30
    max_corr_dist: 0.30
    default_map_path: "/home/orangepi/submap_cloud.ply"
    save_on_shutdown: false
    publish_submap_cloud: true
    submap_cloud_topic: "/icp/submap_cloud"
    submap_publish_interval_sec: 1.0
